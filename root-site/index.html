<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Mia & Max 的網站入口，收錄拾色日記與婚禮網站。" />
    <meta name="google-adsense-account" content="ca-pub-9186241112756787" />
    <meta name="theme-color" content="#f8fafc" />
    <link rel="canonical" href="https://mia-and-max.com/" />
    <title>Mia & Max</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #0f172a; background: #f8fafc; --blue: #2563eb; --green: #047857; --border: #cbd5e1; }
      * { box-sizing: border-box; }
      body { min-width: 320px; min-height: 100dvh; margin: 0; background: radial-gradient(circle at 12% 12%, #dbeafe 0 10%, transparent 10.5%), radial-gradient(circle at 88% 82%, #d1fae5 0 12%, transparent 12.5%), #f8fafc; }
      a { color: inherit; }
      a:focus-visible { outline: 4px solid #f59e0b; outline-offset: 4px; }
      .skip { position: fixed; top: 12px; left: 12px; z-index: 10; padding: 12px 16px; border: 2px solid #0f172a; border-radius: 12px; background: #fff; font-size: 14px; font-weight: 800; transform: translateY(-160%); }
      .skip:focus { transform: none; }
      main { width: min(960px, calc(100% - 32px)); margin: 0 auto; padding: clamp(64px, 10vw, 112px) 0 56px; }
      .eyebrow { margin: 0 0 12px; color: var(--blue); font-size: 13px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
      h1 { max-width: 720px; margin: 0; font-size: clamp(44px, 10vw, 88px); line-height: .95; letter-spacing: -.055em; }
      .intro { max-width: 640px; margin: 24px 0 0; color: #334155; font-size: clamp(18px, 3vw, 22px); line-height: 1.65; }
      .projects { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; margin-top: clamp(48px, 8vw, 76px); }
      .card { min-height: 250px; display: flex; flex-direction: column; justify-content: space-between; padding: clamp(24px, 4vw, 36px); border: 3px solid #0f172a; border-radius: 28px; background: #fff; box-shadow: 8px 8px 0 #0f172a; text-decoration: none; transition: transform 180ms ease, box-shadow 180ms ease, background-color 180ms ease; }
      .card:hover { transform: translate(-3px, -3px); box-shadow: 12px 12px 0 #0f172a; }
      .card:active { transform: translate(4px, 4px); box-shadow: 3px 3px 0 #0f172a; }
      .card.niji { background: #fce7f3; }
      .card.wedding { background: #dcfce7; }
      .card-label { font-size: 13px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
      .card h2 { margin: 24px 0 8px; font-size: clamp(28px, 5vw, 40px); line-height: 1.1; }
      .card p { margin: 0; color: #334155; font-size: 16px; line-height: 1.6; }
      .visit { display: inline-flex; align-items: center; gap: 8px; margin-top: 28px; font-size: 15px; font-weight: 800; }
      .visit svg { width: 20px; height: 20px; }
      footer { margin-top: 56px; padding-top: 24px; border-top: 2px solid var(--border); color: #475569; font-size: 14px; line-height: 1.6; }
      @media (max-width: 680px) { main { width: min(100% - 24px, 520px); padding-top: 52px; }.projects { grid-template-columns: 1fr; }.card { min-height: 220px; border-radius: 22px; box-shadow: 6px 6px 0 #0f172a; } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; } }
    </style>
  </head>
  <body>
    <a class="skip" href="#projects">跳到網站列表</a>
    <main>
      <header>
        <p class="eyebrow">Mia & Max · Digital Garden</p>
        <h1>我們的小小網路空間</h1>
        <p class="intro">收藏生活、顏色與重要日子的地方。每個子網域是一個獨立作品，這裡則是共同入口。</p>
      </header>
      <section class="projects" id="projects" aria-label="網站列表">
        <a class="card niji" href="https://niji.mia-and-max.com/">
          <div><span class="card-label">Color Diary</span><h2>拾色日記</h2><p>每天收集七個喜歡的顏色，把平凡片刻顯影成一道虹。</p></div>
          <span class="visit">前往網站 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg></span>
        </a>
        <a class="card wedding" href="https://wedding.mia-and-max.com/">
          <div><span class="card-label">Our Wedding</span><h2>婚禮網站</h2><p>關於我們的重要日子，以及想與親友分享的婚禮資訊。</p></div>
          <span class="visit">前往網站 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg></span>
        </a>
      </section>
      <footer>© 2026 Mia & Max. 其他作品會陸續加入這個入口。</footer>
    </main>
  </body>
</html>
