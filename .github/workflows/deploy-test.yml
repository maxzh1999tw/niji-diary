name: Deploy test to Cloudflare Pages

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to deploy to the test site
        required: true
        default: main
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-test
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy selected ref to test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build site
        run: npm run build

      - name: Deploy test preview
        id: deploy-test
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: pages deploy docs --project-name=niji-diary --branch=test
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Write deployment summary
        run: |
          {
            echo '### Cloudflare Pages test deployment'
            echo '- Ref: `${{ inputs.ref }}`'
            echo '- Test: https://test.niji-diary.pages.dev'
          } >> "$GITHUB_STEP_SUMMARY"
